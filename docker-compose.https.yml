# Betrieb im Internet mit HTTPS (z. B. auf einem Raspberry Pi).
# Voraussetzungen: eine (Dyn-)DNS-Adresse, die auf euren Anschluss zeigt, und am Router
# freigegebene Ports 80 und 443 zu diesem Gerät. Caddy holt das Zertifikat automatisch.
#   QN_DOMAIN=ninja.example.de docker compose -f docker-compose.https.yml up -d --build
services:
  qwertz-ninja:
    build: .
    restart: unless-stopped
    environment:
      SECURE_COOKIES: "1"
      # Caddy läuft in einem eigenen Container: ein Proxy-Hop, damit die echte Adresse der Nutzer ankommt.
      TRUST_PROXY: "1"
      QN_DOMAIN: ${QN_DOMAIN:-}
      # Optional: Code, der bei der Ersteinrichtung eingegeben werden muss
      QN_SETUP_TOKEN: ${QN_SETUP_TOKEN:-}
      # Demodaten haben ein bekanntes Passwort und sind deshalb im Internetbetrieb aus (1 = trotzdem erlauben)
      QN_ALLOW_DEMO: ${QN_ALLOW_DEMO:-}
      # Nur für die Anmeldung über VIDIS (Mehrschulbetrieb), Werte von der FWU
      QN_PUBLIC_URL: ${QN_PUBLIC_URL:-}
      QN_VIDIS_ISSUER: ${QN_VIDIS_ISSUER:-}
      QN_VIDIS_CLIENT_ID: ${QN_VIDIS_CLIENT_ID:-}
      QN_VIDIS_CLIENT_SECRET: ${QN_VIDIS_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      QN_DOMAIN: ${QN_DOMAIN:?Bitte QN_DOMAIN setzen, z. B. ninja.example.de}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - qwertz-ninja
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
